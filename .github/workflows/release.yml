name: Build & Release Extension

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/release.yml'
      - 'chrome/**'
      - 'firefox/**'
      - 'version.txt'
      - 'enforce.txt'
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            chrome/package-lock.json
            firefox/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if ! VERSION="$VERSION" node <<'NODE'
          const value = process.env.VERSION ?? '';
          const validShape = /^(0|[1-9]\d*)(\.(0|[1-9]\d*)){0,3}$/.test(value);
          const parts = value.split('.').map(Number);
          const validParts = parts.every(part => Number.isInteger(part) && part <= 65535);
          process.exit(validShape && validParts && parts.some(part => part > 0) ? 0 : 1);
          NODE
          then
            echo "Invalid extension version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply version to browser manifests
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e "
            const fs = require('node:fs');
            for (const path of ['chrome/manifest.json', 'firefox/manifest.json']) {
              const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
              manifest.version = process.env.VERSION;
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
            }
          "

      - name: Install Chrome dependencies
        working-directory: chrome
        run: npm ci

      - name: Check and build Chrome extension
        working-directory: chrome
        run: |
          npm run lint
          npm run build

      - name: Reproduce Firefox submission
        run: ./bin/build-firefox

      - name: Install CRX3 packer
        run: go install github.com/mediabuyerbot/go-crx3/crx3@c224f2e57198876ab18740831d142dd12f93c761

      - name: Create browser packages
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if [[ -z "$CRX_PRIVATE_KEY_BASE64" ]]; then
            echo "Missing CRX_PRIVATE_KEY_BASE64 repository secret." >&2
            exit 1
          fi

          mkdir -p release
          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > release-key.pem
          chmod 600 release-key.pem
          trap 'rm -f release-key.pem' EXIT

          (
            cd chrome/dist
            zip -r "../../release/puppetflow-grabber-chrome-v${VERSION}.zip" .
          )

          crx3 pack chrome/dist \
            -p release-key.pem \
            -o "release/puppetflow-grabber-chrome-enterprise-v${VERSION}.crx"

          zip -r "release/puppetflow-grabber-firefox-source-v${VERSION}.zip" \
            README.md version.txt bin/build-firefox firefox \
            -x 'firefox/node_modules/*' 'firefox/dist/*' 'firefox/.DS_Store'

      - name: Show artifact checksums
        run: sha256sum release/*.zip release/*.crx

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: puppetflow-grabber-v${{ steps.version.outputs.value }}
          path: |
            release/puppetflow-grabber-chrome-*
            release/puppetflow-grabber-firefox-*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            release/puppetflow-grabber-chrome-*
            release/puppetflow-grabber-firefox-*
          fail_on_unmatched_files: true
