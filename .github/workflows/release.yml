name: Build & Release Extension

on:
  push:
    branches:
      - master
    paths:
      - 'version.txt'
      - 'enforce.txt'
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Invalid Chrome extension version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Apply version to manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          node -e "
            const fs = require('node:fs');
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            manifest.version = process.env.VERSION;
            fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install CRX3 packer
        run: go install github.com/mediabuyerbot/go-crx3/crx3@latest

      - name: Create ZIP and signed CRX
        env:
          CRX_PRIVATE_KEY_BASE64: ${{ secrets.CRX_PRIVATE_KEY_BASE64 }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if [[ -z "$CRX_PRIVATE_KEY_BASE64" ]]; then
            echo "Missing CRX_PRIVATE_KEY_BASE64 repository secret." >&2
            exit 1
          fi

          mkdir -p release
          printf '%s' "$CRX_PRIVATE_KEY_BASE64" | base64 --decode > release-key.pem
          chmod 600 release-key.pem

          (
            cd dist
            zip -r "../release/puppetflow-grabber-v${VERSION}.zip" .
          )

          crx3 pack dist \
            -p release-key.pem \
            -o "release/puppetflow-grabber-v${VERSION}.crx"

          rm -f release-key.pem

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: puppetflow-grabber-v${{ steps.version.outputs.value }}
          path: |
            release/*.zip
            release/*.crx
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.crx
          fail_on_unmatched_files: true
