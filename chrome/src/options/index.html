<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puppetflow Grabber settings</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --brand: #48c591;
        --brand-hover: #3db580;
        --text: #111827;
        --text-secondary: #4b5563;
        --text-tertiary: #9ca3af;
        --border: #e5e7eb;
        --background: #f9fafb;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--text);
        background: var(--background);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(680px, calc(100vw - 40px));
        margin: 0 auto;
        padding: 48px 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text-secondary);
        font-size: 13px;
        font-weight: 600;
      }
      .brand img {
        width: 32px;
        height: 32px;
        border-radius: 6px;
      }
      header { margin: 48px 0 24px; }
      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 650;
        line-height: 1.2;
        letter-spacing: -.025em;
      }
      .intro {
        margin: 8px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
      }
      .card-section { padding: 24px; }
      .card-section + .card-section { border-top: 1px solid var(--border); }
      h2 {
        margin: 0 0 16px;
        font-size: 14px;
        font-weight: 600;
      }
      .tool-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }
      .tool-row h2 { margin: 0; }
      .tool-row p {
        margin: 3px 0 0;
        color: var(--text-tertiary);
        font-size: 12px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 500;
      }
      form { display: flex; gap: 8px; }
      input {
        flex: 1;
        min-width: 0;
        padding: 9px 11px;
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        color: var(--text);
        background: #fff;
        font: inherit;
        font-size: 13px;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }
      input::placeholder { color: var(--text-tertiary); }
      input:focus {
        border-color: #10b981;
        box-shadow: 0 0 0 2px rgba(16, 185, 129, .12);
      }
      button {
        padding: 9px 14px;
        border: 0;
        border-radius: 6px;
        color: #fff;
        background: var(--brand);
        font: inherit;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background 120ms ease;
      }
      button:hover { background: var(--brand-hover); }
      button:focus-visible { outline: 2px solid rgba(16, 185, 129, .24); outline-offset: 2px; }
      .secondary-button {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: #fff;
      }
      .secondary-button:hover { color: var(--text); background: var(--background); }
      .secondary-button:disabled { color: #059669; cursor: default; }
      ul { margin: 0; padding: 0; list-style: none; }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 42px;
        padding: 8px 0;
        border-top: 1px solid var(--border);
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
        font-size: 12px;
      }
      li:first-child { border-top: 0; }
      li button {
        padding: 6px 9px;
        border: 1px solid var(--border);
        color: var(--text-secondary);
        background: #fff;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 11px;
      }
      li button:hover { color: #dc2626; background: #f9fafb; }
      .empty {
        min-height: 0;
        padding: 0;
        border: 0;
        color: var(--text-tertiary);
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 12px;
      }
      @media (max-width: 560px) {
        main { width: min(100% - 28px, 680px); padding: 28px 0; }
        header { margin-top: 36px; }
        .card-section { padding: 20px; }
        form { flex-direction: column; }
        form button { width: 100%; }
        .tool-row { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="../../assets/icons/icon-32.png" alt="" />
        Puppetflow Grabber
      </div>

      <header>
        <h1>Grabber settings</h1>
        <p class="intro">Manage the extension onboarding experience.</p>
      </header>

      <section class="card">
        <div class="card-section tool-row">
          <div>
            <h2>Onboarding</h2>
            <p>Show the introduction popup on the next toolbar click.</p>
          </div>
          <button class="secondary-button" id="reset-onboarding" type="button">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.34 5.66"/><path d="M20 4v7h-7"/>
            </svg>
            Reset onboarding
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
